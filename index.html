<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LikhAgham | The Borrowed Bench</title>
    <style>
      :root {
        --bg: #071018;
        --panel: #101d2a;
        --panel-2: #162b39;
        --fg: #eef8ff;
        --muted: #9cb5c9;
        --accent: #8fe7ff;
        --accent-2: #7c8cff;
        --hot: #ff5ca8;
        --line: rgba(143, 231, 255, 0.2);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, rgba(124,140,255,.18), transparent 28%),
                    radial-gradient(circle at bottom right, rgba(255,92,168,.12), transparent 28%),
                    linear-gradient(180deg, #071018, #0b1320 40%, #071018);
        color: var(--fg);
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 40px 20px 60px;
      }

      header {
        padding: 24px 0 18px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }

      main {
        padding-top: 30px;
      }

      .card {
        background: linear-gradient(180deg, rgba(16,24,34,.95), rgba(9,14,22,.88));
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px;
        box-shadow: 0 16px 28px rgba(0,0,0,0.25);
      }

      p {
        margin: 0 0 12px;
        line-height: 1.6;
        color: var(--fg);
      }

      .accent {
        color: var(--accent);
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      footer {
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>LikhAgham</h1>
        <p class="subtitle">The Borrowed Bench: Virtual Chemistry &amp; Thermodynamics Lab</p>
      </header>

      <main>
        <div class="card">
          <p><span class="accent">Virtual learning studio</span> for chemistry and thermodynamics.</p>
          <p>Explore interactive models and classroom-ready scientific concepts in a clean digital lab experience.</p>
        </div>
      </main>

      <footer>
        <p>Contact: <a href="mailto:LikhAgham@gmail.com">LikhAgham@gmail.com</a></p>
      </footer>
    </div>
  </body>
</html>
